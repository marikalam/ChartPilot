services:
  - type: web
    name: chartpilot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSCODE
        sync: false
      # Optional: a third-party evidence engine (e.g. OpenEvidence) - see DEPLOY.md
      - key: EVIDENCE_API_URL
        sync: false
      - key: EVIDENCE_API_KEY
        sync: false
